name: Terraform Validation

on:
  push:
    branches: [main]
    paths:
      - '**.tf'
      - '**.tfvars'
      - '**.tftest.hcl'
      - '**.md'
      - 'tests/**'
      - 'functions/**'
      - 'Makefile'
      - '.tflint.hcl'
      - '.terraform-docs.yml'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.tf'
      - '**.tfvars'
      - '**.tftest.hcl'
      - '**.md'
      - 'tests/**'
      - 'functions/**'
      - 'Makefile'
      - '.tflint.hcl'
      - '.terraform-docs.yml'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routing:
    name: Routing behavior
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test viewer-request routing
        run: make test-router
  sync:
    name: Sync API contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test SDK
        run: python -m pip install -r tests/requirements.txt
      - name: Test sync API contract
        run: make test-sync

  validate:
    name: Validate (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - examples/basic
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Initialize without a state backend
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false
      - name: Validate configuration
        working-directory: ${{ matrix.directory }}
        run: terraform validate

  test:
    name: Unit tests (${{ matrix.aws }})
    strategy:
      matrix:
        aws: ['5.43.0', 'latest']
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Initialize without a state backend
        run: terraform init -backend=false
      - name: Select minimum supported provider
        if: matrix.aws == '5.43.0'
        run: |
          cat > provider_override.tf.json <<'JSON'
          {"terraform":{"required_providers":{"aws":{"source":"hashicorp/aws","version":"= 5.43.0"}}}}
          JSON
          terraform init -backend=false -upgrade
      - name: Terraform test
        run: terraform test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
      - name: Initialize TFLint
        run: tflint --init
      - name: Run TFLint
        run: tflint -f compact --recursive

  docs:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify generated reference is current
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: .
          output-file: README.md
          output-method: inject
          fail-on-diff: true
