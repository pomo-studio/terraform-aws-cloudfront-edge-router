version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: terraform
    directories:
      - /
      - /examples/**
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    # Keep documented compatibility bounds; review major upgrades separately.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      terraform-minor-patch:
        update-types: [minor, patch]
